
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyTube</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f0f0f;color:white;font-family:Arial,sans-serif}
header{height:65px;display:flex;align-items:center;gap:15px;padding:0 16px;background:#161616;position:sticky;top:0;z-index:5}
.logo{font-size:23px;font-weight:bold;color:#ff3333;white-space:nowrap}
.search{flex:1;display:flex;max-width:600px;margin:auto}
input{min-width:0;width:100%;padding:12px;border:1px solid #444;border-radius:22px 0 0 22px;background:#0f0f0f;color:white;font-size:16px}
button{cursor:pointer;border:0;color:white;background:#303030;padding:11px 16px}
.search button{border-radius:0 22px 22px 0}
.layout{display:flex}
aside{width:175px;padding:18px 10px;flex-shrink:0}
aside button{display:block;width:100%;text-align:left;margin-bottom:8px;border-radius:10px}
aside button:hover,.active{background:#383838}
main{padding:22px;flex:1;min-width:0}
h2{font-size:21px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:24px 16px}
.card{cursor:pointer;min-width:0}
.thumb{width:100%;aspect-ratio:16/9;border-radius:12px;background:#272727;display:flex;align-items:center;justify-content:center;font-size:48px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.card h3{font-size:15px;line-height:1.4;margin:10px 0 5px}
.meta{font-size:13px;color:#aaa}
#player{display:none;margin-bottom:24px}
#player iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}
.playerTitle{font-size:20px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.actions button{border-radius:20px}
#message{color:#aaa}
@media(max-width:600px){
 header{padding:0 10px;gap:8px}.logo{font-size:18px}
 aside{width:70px;padding:12px 4px}
 aside button{text-align:center;padding:12px 2px;font-size:11px}
 main{padding:12px 9px}.grid{grid-template-columns:1fr;gap:22px}
 .thumb{border-radius:9px}.search button{padding:10px}
}
</style>
</head>
<body>
<header>
  <div class="logo">▶ MyTube</div>
  <form class="search" id="searchForm">
    <input id="searchInput" placeholder="Search videos..." aria-label="Search videos">
    <button aria-label="Search">🔎</button>
  </form>
</header>

<div class="layout">
<aside>
  <button onclick="showHome()">🏠 Home</button>
  <button onclick="showLiked()">❤️ Liked</button>
  <button onclick="showAll()">🎬 All videos</button>
</aside>

<main>
  <section id="player">
    <iframe id="videoFrame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    <h2 class="playerTitle" id="playingTitle"></h2>
    <div class="actions">
      <button id="likeButton">🤍 Like</button>
      <button onclick="closePlayer()">✖ Close video</button>
      <button id="youtubeButton">▶ Open on YouTube</button>
    </div>
    <p class="meta">Video playback is provided by YouTube.</p>
  </section>

  <h2 id="heading">Recommended videos</h2>
  <p id="message">Welcome to MyTube! Choose a video below.</p>
  <div class="grid" id="grid"></div>
</main>
</div>

<script>
const videos = [
 {id:"jNQXAC9IVRw",title:"Me at the zoo — the first YouTube video",channel:"YouTube Classics",emoji:"🦁"},
 {id:"aqz-KE-bpKQ",title:"Big Buck Bunny — animated short",channel:"Animation",emoji:"🐰"},
 {id:"ScMzIvxBSi4",title:"Creative video demo",channel:"Video Demos",emoji:"🎬"},
 {id:"M7lc1UVf-VE",title:"YouTube player demo",channel:"Developers",emoji:"💻"},
 {id:"ysz5S6PUM-U",title:"Sample video",channel:"Video Demos",emoji:"🌍"},
 {id:"dQw4w9WgXcQ",title:"A classic internet surprise",channel:"Internet Classics",emoji:"🎵"}
];

let liked = JSON.parse(localStorage.getItem("mytube-likes") || "[]");
let current = null;
let mode = "all";

const grid = document.getElementById("grid");
const player = document.getElementById("player");

function render(list){
 grid.innerHTML = "";
 document.getElementById("message").textContent =
   list.length ? "" : "No videos found. Try another search!";
 list.forEach(v=>{
   const card = document.createElement("article");
   card.className = "card";
   card.innerHTML = `
    <div class="thumb">
      <img src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg"
       alt="" loading="lazy"
       onerror="this.style.display='none';this.parentElement.textContent='${v.emoji}'">
    </div>
    <h3></h3>
    <div class="meta"></div>`;
   card.querySelector("h3").textContent = v.title;
   card.querySelector(".meta").textContent =
     v.channel + (liked.includes(v.id) ? " · ❤️" : "");
   card.onclick = ()=>play(v);
   grid.appendChild(card);
 });
}

function play(v){
 current = v;
 player.style.display = "block";
 document.getElementById("playingTitle").textContent = v.title;
 document.getElementById("videoFrame").src =
   "https://www.youtube-nocookie.com/embed/" + v.id;
 document.getElementById("youtubeButton").onclick = ()=>
   window.open("https://www.youtube.com/watch?v="+v.id,"_blank");
 updateLike();
 player.scrollIntoView({behavior:"smooth",block:"start"});
}

function closePlayer(){
 document.getElementById("videoFrame").src = "";
 player.style.display = "none";
 current = null;
}

function updateLike(){
 document.getElementById("likeButton").textContent =
   liked.includes(current.id) ? "❤️ Liked" : "🤍 Like";
}

document.getElementById("likeButton").onclick = ()=>{
 if(!current)return;
 liked = liked.filter(id=>id!==current.id);
 if(!JSON.parse(localStorage.getItem("mytube-likes")||"[]").includes(current.id))
   liked.push(current.id);
 localStorage.setItem("mytube-likes",JSON.stringify(liked));
 updateLike();
 if(mode==="liked")showLiked();
 else render(videos.filter(v=>
   v.title.toLowerCase().includes(document.getElementById("searchInput").value.toLowerCase())));
};

function showHome(){
 mode="all";
 document.getElementById("heading").textContent="Recommended videos";
 document.getElementById("searchInput").value="";
 render(videos);
}
function showAll(){showHome()}
function showLiked(){
 mode="liked";
 document.getElementById("heading").textContent="Liked videos";
 render(videos.filter(v=>liked.includes(v.id)));
}
document.getElementById("searchForm").onsubmit = e=>{
 e.preventDefault();
 mode="search";
 const q=document.getElementById("searchInput").value.toLowerCase().trim();
 document.getElementById("heading").textContent="Search results";
 render(videos.filter(v=>(v.title+" "+v.channel).toLowerCase().includes(q)));
};
render(videos);
</script>
</body>
</html>
